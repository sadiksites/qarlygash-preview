locale: ru
backend:
  name: git-gateway
  repo: sadiksites/qarlygash-preview
  branch: main
  identity_url: https://auth.decapbridge.com/sites/DECAPBRIDGE_SITE_ID
  gateway_url: https://gateway.decapbridge.com
  squash_merges: true
  commit_messages:
    create: 'CMS: создано {{slug}} — {{author-name}}'
    update: 'CMS: изменено {{slug}} — {{author-name}}'
    delete: 'CMS: удалено {{slug}} — {{author-name}}'
    uploadMedia: 'CMS: фото {{path}} — {{author-name}}'
    deleteMedia: 'CMS: удалено фото {{path}} — {{author-name}}'
    openAuthoring: '{{message}}'
site_url: https://sadiksites.github.io/qarlygash-preview/
display_url: https://sadiksites.github.io/qarlygash-preview/
logo_url: https://sadiksites.github.io/qarlygash-preview/assets/logo.png
media_folder: assets/uploads
public_folder: assets/uploads
collections:
- name: site
  label: Сайт «Қарлығаш»
  editor:
    preview: false
  files:
  - name: home
    label: 🏠 Главная страница
    file: data/home.json
    fields:
    - name: hero
      label: Главное фото (вверху)
      widget: image
    - name: head_photo
      label: Фото заведующей
      widget: image
    - name: team
      label: Коллектив (карточки)
      label_singular: сотрудника
      widget: list
      summary: '{{fields.name.kk}}'
      fields:
      - name: photo
        label: Фото
        widget: image
      - name: name
        label: ФИО
        widget: object
        collapsed: false
        fields:
        - name: kk
          label: Қазақша
          widget: string
          required: true
        - name: ru
          label: Русский
          widget: string
          required: false
      - name: role
        label: Должность
        widget: object
        collapsed: false
        fields:
        - name: kk
          label: Қазақша
          widget: string
          required: true
        - name: ru
          label: Русский
          widget: string
          required: false
      - name: exp
        label: Стаж и категория
        widget: object
        collapsed: false
        fields:
        - name: kk
          label: Қазақша
          widget: string
          required: false
        - name: ru
          label: Русский
          widget: string
          required: false
    - name: awards
      label: Награды (фото грамот)
      widget: list
      summary: '{{fields.image}}'
      fields:
      - name: image
        label: Фото
        widget: image
    - name: events
      label: Фотогалерея мероприятий
      widget: list
      summary: '{{fields.image}}'
      fields:
      - name: image
        label: Фото
        widget: image
    - name: texts
      label: Тексты главной страницы
      label_singular: текст
      widget: list
      allow_add: false
      summary: '{{fields.kk}}'
      fields:
      - name: key
        label: Код (не менять)
        widget: hidden
      - name: kk
        label: Қазақша
        widget: text
      - name: ru
        label: Русский
        widget: text
        required: false
